name: infantibio
channels:
  - bioconda
  - conda-forge
  - defaults
 
dependencies:
  - python=3.12.1
  - r-base=4.4.0
  - kneaddata=0.10.0
  - trim-galore=0.6.10
  - bowtie2=2.5.1        # required for MetaPhlAn (installed via pip)
  - diamond=2.0.15         # required for HUMAnN (installed via pip)
  - megahit=1.2.9
  - prodigal=2.6.3
  - cd-hit=4.8.1
  - interproscan=5.55_88.0
  - emboss=6.6.0
  - r-dplyr=1.1.4
  - r-ggplot2=3.5.2
  - r-vegan=2.7_2
  - r-ggrepel=0.9
  - r-ggtext=0.1.2
  - bioconductor-maaslin2=1.18.0
 
  # Python packages installed via pip:
  - pip
  - pip:
      - metaphlan=4.1.1        # includes StrainPhlAn 4.1.1      # can also be installed via conda
      - phylophlan=3.1.1       # can also be installed via conda
      - graphlan=1.1.3.1       # can also be installed via conda
      - humann=3.6             # can also be installed via conda
      - numpy==1.24.3
      - matplotlib==3.7.2
      - seaborn==0.11.2
      - pandas==1.5.3
      - scipy==1.11.1
      - statannotations==0.6.0